[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-commerce"
version = "0.1.0"
requires-python = ">=3.11"
# Direct dependencies only. requirements.txt stays as the fully pinned list.
dependencies = [
    "anthropic<1.0.0",
    "pydantic>=2",
    "requests",
    "python-dotenv",
    "langchain",
    "langchain-anthropic"
]

[tool.setuptools.packages.find]
include = ["app*"]
